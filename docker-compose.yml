version: '3.8'

services:
  app_container:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    networks:
      - app_network

  reverse_proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app_container
    links:
      - app_container:app_container
    networks:
      - app_network

networks:
  app_network:
    driver: bridge